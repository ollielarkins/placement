# Scheduled data imports (spec: "Daily vacancies, monthly Companies House sync").
#
# The imports are Node scripts that stream large files, so they run here
# rather than in pg_cron. Repository secrets needed (Settings > Secrets and
# variables > Actions):
#   DATABASE_URL  Supabase "Session pooler" connection string for the postgres
#                 role (GitHub runners have no IPv6, so not the direct one)
#   FAA_API_KEY   Find an apprenticeship Display Advert API key
# Times are UTC. Each job can also be started by hand from the Actions tab.

name: Data imports

on:
  schedule:
    - cron: '23 4 * * *'   # vacancies, daily
    - cron: '41 2 3 * *'   # Companies House, 3rd of each month (the snapshot is published early in the month)
  workflow_dispatch:
    inputs:
      job:
        description: Which import to run
        type: choice
        options: [vacancies, vacancies-full-lookup, companies-house]
        default: vacancies

concurrency:
  group: data-imports
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  vacancies:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '23 4 * * *') ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.job, 'vacancies'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FAA_API_KEY: ${{ secrets.FAA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The Companies House register (about 500 MB) is cached for the month.
      - name: Month
        id: month
        run: echo "key=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            .data/BasicCompanyDataAsOneFile-*
            .data/postcodes-cache.json
          key: ch-${{ steps.month.outputs.key }}
          restore-keys: ch-
      # Daily runs skip the register scan unless it's Monday or asked for:
      # employers we don't hold are still listed (0037), just without a company page until then.
      - name: Import vacancies
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ inputs.job }}" = "vacancies-full-lookup" ]; then
            npm run import:vacancies
          else
            npm run import:vacancies -- --no-ch-lookup
          fi
      - name: Refresh cached search tables
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "select public.refresh_read_models();"

  companies-house:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '41 2 3 * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'companies-house')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Month
        id: month
        run: echo "key=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            .data/BasicCompanyDataAsOneFile-*
            .data/postcodes-cache.json
          key: ch-${{ steps.month.outputs.key }}
          restore-keys: ch-
      - name: Import Companies House
        run: npm run import:ch
      - name: Refresh cached search tables
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "select public.refresh_read_models();"
